<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario de la tienda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Inventario de la tienda</h1>

    <section class="panel" aria-labelledby="titulo-alta">
      <h2 id="titulo-alta">Agregar producto</h2>
      <form id="formulario-producto" novalidate>
        <label>Nombre
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Taladro inalámbrico">
        </label>
        <label>Categoría
          <input type="text" id="categoria" name="categoria" placeholder="Ej. Herramientas">
        </label>
        <label>Cantidad
          <input type="number" id="cantidad" name="cantidad" min="1" step="1">
        </label>
        <label>Precio (USD)
          <input type="number" id="precio" name="precio" min="0" step="0.01">
        </label>
        <button type="submit">Agregar producto</button>
      </form>
      <p id="mensaje-error" role="alert"></p>
    </section>

    <section class="indicadores" aria-label="Indicadores">
      <!-- Los indicadores reflejan los productos VISIBLES (los que cumplen el filtro actual). -->
      <div><span id="total-productos">0</span> productos</div>
      <div><span id="total-unidades">0</span> unidades</div>
      <div>$<span id="valor-total">0.00</span> en valor</div>
      <div><span id="total-agotados">0</span> agotados</div>
    </section>

    <section class="panel">
      <label class="filtro">Filtrar por categoría
        <select id="filtro-categoria">
          <option value="todas">todas</option>
        </select>
      </label>

      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-inventario"></tbody>
      </table>
      <p id="mensaje-vacio" hidden>No hay productos en esta categoría. Cambia el filtro o agrega uno nuevo.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
